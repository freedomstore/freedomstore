name: "Validate Release Manifests"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - altstore-source.json
      - .github/scripts/validate-release-manifests.mjs
      - .github/workflows/validate-release-manifests.yml

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-release-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate new release manifests
        id: validate
        continue-on-error: true
        run: |
          node .github/scripts/validate-release-manifests.mjs \
            --source altstore-source.json \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --comment-file manifest-check-comment.md

      - name: Comment on pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- freedomstore-release-manifest-check -->";
            const fallbackBody = [
              marker,
              "### Freedom Store release manifest check",
              "",
              "Result: failed.",
              "",
              "The validator did not produce a comment file. Check the workflow logs.",
            ].join("\n");
            const body = fs.existsSync("manifest-check-comment.md")
              ? fs.readFileSync("manifest-check-comment.md", "utf8")
              : fallbackBody;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existingComment = comments.find((comment) => {
              return comment.user?.type === "Bot" && comment.body?.includes(marker);
            });

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail on manifest validation errors
        if: always() && steps.validate.outcome == 'failure'
        run: exit 1
