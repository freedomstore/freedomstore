name: "Validate Release Manifests"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - altstore-source.json
      - .github/scripts/validate-release-manifests.mjs
      - .github/scripts/comment-release-manifests*
      - .github/workflows/comment-release-manifests.yml
      - .github/workflows/validate-release-manifests.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-release-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test release comments
        run: node --test .github/scripts/comment-release-manifests.test.cjs

      - name: Validate new release manifests
        id: validate
        continue-on-error: true
        run: |
          node .github/scripts/validate-release-manifests.mjs \
            --source altstore-source.json \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --comment-file manifest-check-comment.md

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-report-${{ github.run_attempt }}
          path: manifest-check-comment.md
          if-no-files-found: warn
          retention-days: 7

      - name: Fail on manifest validation errors
        if: always() && steps.validate.outcome == 'failure'
        run: exit 1
